# Docker Compose for the full stack — all values come from .env
# Prod: docker compose up -d --build                          (reads .env)
# Dev:  docker compose --env-file .env.example up -d --build  (local overrides)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Localhost only — use SSH tunnel for remote DB access: ssh -L 5432:127.0.0.1:5432 root@your-server
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./escort-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      OXAPAY_MERCHANT_KEY: ${OXAPAY_MERCHANT_KEY}
    volumes:
      - ./escort-backend/uploads:/app/uploads
    ports:
      - "127.0.0.1:3000:3000"

  frontend:
    build:
      context: ./velvet-escapes
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      SITE_URL: ${SITE_URL}
      API_BASE_URL: ${API_BASE_URL}
      UPLOADS_DIR: /app/uploads
    volumes:
      - ./escort-backend/uploads:/app/uploads:ro

volumes:
  pgdata:
